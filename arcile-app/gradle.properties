# Gradle settings configured through the IDE override this file.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Modules are decoupled, so independent ones build at the same time.
org.gradle.parallel=true
# Reuse task outputs across branches and clean builds.
org.gradle.caching=true
# Skip re-running build scripts when nothing that configures the build has changed.
org.gradle.configuration-cache=true

android.useAndroidX=true
kotlin.code.style=official
# Each library's R class holds only its own resources.
android.nonTransitiveRClass=true

# Required with the current AGP/KSP toolchain. Remove only after the project upgrades to
# a built-in Kotlin compatible KSP integration that no longer writes through kotlin.sourceSets.
android.disallowKotlinSourceSets=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

# Compose compiler stability reports are written only when asked for:
#   ./gradlew :app:assembleRelease -Parcile.composeReports=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
